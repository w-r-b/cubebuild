name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pipeline (editable) with the test extra
        run: pip install -e ".[test]"

      - name: Import smoke test
        run: python -c "import cubebuild; print(cubebuild.__version__)"

      - name: Command-line smoke test
        run: cubebuild --version

      - name: Data-independent tests
        run: pytest tests/test_contract.py tests/test_pixel_area.py